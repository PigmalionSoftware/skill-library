name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-sandbox/go
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agent-sandbox/go/go.mod
          cache: true
          cache-dependency-path: agent-sandbox/go/go.sum

      - name: Run tests
        run: go test ./...
