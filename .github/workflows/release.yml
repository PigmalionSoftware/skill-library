name: Release

on:
  push:
    tags:
      - "agent-sandbox-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Linux release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-sandbox/go
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agent-sandbox/go/go.mod
          cache: true
          cache-dependency-path: agent-sandbox/go/go.sum

      - name: Build Linux archive
        run: |
          mkdir -p dist/package
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/package/agent-sandbox ./cmd/agent-sandbox
          tar -C dist/package -czf dist/agent-sandbox_linux_amd64.tar.gz agent-sandbox
          sha256sum dist/agent-sandbox_linux_amd64.tar.gz > dist/agent-sandbox_linux_amd64.tar.gz.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            agent-sandbox/go/dist/agent-sandbox_linux_amd64.tar.gz
            agent-sandbox/go/dist/agent-sandbox_linux_amd64.tar.gz.sha256
